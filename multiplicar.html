<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla del 3</title>
    <link rel="stylesheet" href="multiplicar.css">
</head>
<body>

    <main class="contenedor">

        <header class="encabezado">
            <h1>Tabla de multiplicar del 3</h1>
            <p>Aprende y practica las multiplicaciones</p>
        </header>

        <section class="contenido">

            <div class="zona-boton">
                <a href="#tabla" class="boton-probar">PROBAR</a>
            </div>

            <h2 id="tabla">Tabla del 3</h2>

            <div class="tabla-multiplicar">

                <div class="fila">
                    <span>3 × 1</span>
                    <span>3</span>
                </div>

                <div class="fila">
                    <span>3 × 2</span>
                    <span>6</span>
                </div>

                <div class="fila">
                    <span>3 × 3</span>
                    <span>9</span>
                </div>

                <div class="fila">
                    <span>3 × 4</span>
                    <span>12</span>
                </div>

                <div class="fila">
                    <span>3 × 5</span>
                    <span>15</span>
                </div>

                <div class="fila">
                    <span>3 × 6</span>
                    <span>18</span>
                </div>

                <div class="fila">
                    <span>3 × 7</span>
                    <span>21</span>
                </div>

                <div class="fila">
                    <span>3 × 8</span>
                    <span>24</span>
                </div>

                <div class="fila">
                    <span>3 × 9</span>
                    <span>27</span>
                </div>

                <div class="fila">
                    <span>3 × 10</span>
                    <span>30</span>
                </div>

            </div>

        </section>

        <footer class="pie">
            <p>¡Practica cada día y aprende matemáticas!</p>
        </footer>

    </main>

</body>
</html>
